<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>NXKAAV Cube Jump v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a1a; font-family: 'Segoe UI', sans-serif; user-select: none; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; z-index: 10; pointer-events: none;
  }
  .hud-item { color: #fff; font-size: 13px; font-weight: bold; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  .hud-item b { color: #00d4ff; font-size: 20px; display: block; }
  .hud-item.coin b { color: #ffd700; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #fff; text-align: center;
    background: rgba(10, 10, 26, 0.9); backdrop-filter: blur(8px); padding: 20px; z-index: 20;
  }
  #overlay.hidden { display: none; }
  h1 { font-size: 30px; margin-bottom: 12px; background: linear-gradient(135deg, #00d4ff, #ff00ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  p { font-size: 14px; color: #aaa; margin-bottom: 24px; line-height: 1.7; }
  p b { color: #00d4ff; }
  p .gold { color: #ffd700; }
  button {
    padding: 14px 40px; font-size: 16px; font-weight: bold; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #00d4ff, #ff00ea); border: none;
    border-radius: 50px; box-shadow: 0 8px 24px rgba(0, 212, 255, 0.4);
    transition: transform 0.15s; font-family: inherit;
  }
  button:active { transform: scale(0.95); }
  #jumpBtn {
    position: absolute; right: 20px; bottom: 40px; width: 90px; height: 90px;
    border-radius: 50%; font-size: 14px; padding: 0; z-index: 10;
    display: none; opacity: 0.7; border: 2px solid rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="hud-item">SCORE<b id="scoreVal">0</b></div>
  <div class="hud-item coin">COINS<b id="coinVal">0</b></div>
  <div class="hud-item">BEST<b id="bestVal">0</b></div>
</div>
<button id="jumpBtn">JUMP</button>
<div id="overlay">
  <h1>NXKAAV Cube Jump</h1>
  <p>
    <b>TAP</b> = Lompat · <b>TAP 2x</b> = Double Jump<br>
    <span class="gold">💰 Kumpulkan coin (+5 skor)</span><br>
    ⚠️ Hindari spike &amp; block!
  </p>
  <button id="startBtn">TAP UNTUK MULAI</button>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const coinVal = document.getElementById('coinVal');
  const jumpBtn = document.getElementById('jumpBtn');

  let W, H, DPR;
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const GRAVITY = 0.9;
  const JUMP_V = -15;
  const DOUBLE_JUMP_V = -12;
  const BASE_SPEED = 5;
  const SPEED_INC = 0.0012;
  const GROUND_RATIO = 0.78;

  let state = 'idle';
  let score, coins, best = parseInt(localStorage.getItem('nxkaav_best') || '0', 10);
  let speed, cube, obstacles, coinsArr, particles, trail, tick, groundY;

  bestVal.textContent = best;

  let audioCtx = null;
  function initAudio(){
    if (audioCtx) return;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  function beep(freq, dur, type){
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.04, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }

  function reset(){
    resize();
    groundY = H * GROUND_RATIO;
    score = 0; coins = 0; tick = 0;
    speed = BASE_SPEED;
    cube = { x: W * 0.18, y: groundY - 40, w: 40, h: 40, vy: 0, onGround: true, rot: 0, jumps: 0 };
    obstacles = []; coinsArr = []; particles = []; trail = [];
    scoreVal.textContent = '0';
    coinVal.textContent = '0';
  }

  function spawnObstacle(){
    const r = Math.random();
    if (r < 0.6){
      obstacles.push({ type: 'spike', x: W + 20, y: groundY - 34, w: 34, h: 34, passed: false });
    } else if (r < 0.85){
      const h = 30 + Math.random() * 40;
      obstacles.push({ type: 'block', x: W + 20, y: groundY - h, w: 34, h: h, passed: false });
    } else {
      obstacles.push({ type: 'spike', x: W + 20, y: groundY - 34, w: 34, h: 34, passed: false });
      obstacles.push({ type: 'spike', x: W + 54, y: groundY - 34, w: 34, h: 34, passed: false });
    }
    if (Math.random() < 0.55){
      const cy = groundY - 90 - Math.random() * 60;
      coinsArr.push({ x: W + 60 + Math.random() * 80, y: cy, r: 12, taken: false, ang: 0 });
    }
  }

  function rectHit(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function circleHit(r, c){
    const cx = Math.max(r.x, Math.min(c.x, r.x + r.w));
    const cy = Math.max(r.y, Math.min(c.y, r.y + r.h));
    const dx = c.x - cx, dy = c.y - cy;
    return dx*dx + dy*dy < c.r * c.r;
  }

  function jump(){
    if (state !== 'playing') return;
    if (cube.onGround){
      cube.vy = JUMP_V; cube.onGround = false; cube.jumps = 1;
      beep(600, 0.08, 'square');
      spawnBurst(8, '#00d4ff');
    } else if (cube.jumps < 2){
      cube.vy = DOUBLE_JUMP_V; cube.jumps = 2;
      beep(900, 0.08, 'square');
      spawnBurst(10, '#00d4ff');
    }
  }

  function spawnBurst(n, color){
    for (let i = 0; i < n; i++){
      particles.push({
        x: cube.x + cube.w/2, y: cube.y + cube.h,
        vx: (Math.random() - 0.5) * 5, vy: Math.random() * 3 + 1,
        life: 18, maxLife: 18, size: 4, color: color
      });
    }
  }

  function spawnDeathBurst(){
    for (let i = 0; i < 30; i++){
      particles.push({
        x: cube.x + cube.w/2, y: cube.y + cube.h/2,
        vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
        life: 40, maxLife: 40, size: 5, color: i % 2 ? '#00d4ff' : '#ff00ea'
      });
    }
  }

  function update(){
    if (state !== 'playing') return;
    tick++;
    speed = BASE_SPEED + tick * SPEED_INC;

    cube.vy += GRAVITY;
    cube.y += cube.vy;
    if (cube.y + cube.h >= groundY){
      cube.y = groundY - cube.h; cube.vy = 0; cube.onGround = true;
      cube.jumps = 0; cube.rot = 0;
    } else {
      cube.onGround = false;
      cube.rot += 0.16;
    }

    trail.push({ x: cube.x + cube.w/2, y: cube.y + cube.h/2, life: 15 });
    if (trail.length > 20) trail.shift();
    for (let i = trail.length - 1; i >= 0; i--){
      trail[i].life--;
      if (trail[i].life <= 0) trail.splice(i, 1);
    }

    if (tick % Math.max(40, Math.floor(90 - tick * 0.05)) === 0){
      spawnObstacle();
    }

    for (let i = obstacles.length - 1; i >= 0; i--){
      const o = obstacles[i];
      o.x -= speed;
      if (rectHit(cube, o)){
        state = 'dead';
        spawnDeathBurst();
        beep(120, 0.35, 'sawtooth');
        if (score > best){ best = score; localStorage.setItem('nxkaav_best', best); bestVal.textContent = best; }
        setTimeout(() => {
          overlay.classList.remove('hidden');
          overlay.querySelector('h1').textContent = 'Game Over';
          overlay.querySelector('p').innerHTML = 'Skor: <b>' + score + '</b> · Coin: <b class="gold">' + coins + '</b><br>Best: <b>' + best + '</b>';
          startBtn.textContent = 'MAIN LAGI';
        }, 350);
        return;
      }
      if (!o.passed && o.x + o.w < cube.x){ o.passed = true; score++; scoreVal.textContent = score; }
      if (o.x + o.w < -50) obstacles.splice(i, 1);
    }

    for (let i = coinsArr.length - 1; i >= 0; i--){
      const c = coinsArr[i];
      c.x -= speed; c.ang += 0.15;
      if (!c.taken && circleHit(cube, c)){
        c.taken = true;
        coins++; score += 5;
        coinVal.textContent = coins;
        scoreVal.textContent = score;
        beep(1200, 0.1, 'sine');
        for (let k = 0; k < 8; k++){
          particles.push({
            x: c.x, y: c.y,
            vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
            life: 20, maxLife: 20, size: 4, color: '#ffd700'
          });
        }
        coinsArr.splice(i, 1);
        continue;
      }
      if (c.x + c.r < -50) coinsArr.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function draw(){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0a0a1a'); g.addColorStop(1, '#1a0a2e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for (let i = 0; i < 60; i++){
      const x = (i * 137 + tick * 0.4) % W;
      const y = (i * 89) % (groundY - 40);
      ctx.fillRect(x, y, 2, 2);
    }

    ctx.fillStyle = '#0f0f2a'; ctx.fillRect(0, groundY, W, H - groundY);
    ctx.strokeStyle = '#00d4ff'; ctx.lineWidth = 3;
    ctx.shadowBlur = 20; ctx.shadowColor = '#00d4ff';
    ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(W, groundY); ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.strokeStyle = 'rgba(0, 212, 255, 0.3)'; ctx.lineWidth = 1;
    for (let i = 0; i < 24; i++){
      const x = (i * 80 - (tick * speed) % 80);
      ctx.beginPath(); ctx.moveTo(x, groundY + 10); ctx.lineTo(x + 40, groundY + 10); ctx.stroke();
    }

    for (let i = 0; i < trail.length; i++){
      const t = trail[i];
      const a = (t.life / 15) * 0.4;
      const s = 30 * (t.life / 15);
      ctx.fillStyle = 'rgba(0, 212, 255, ' + a + ')';
      ctx.fillRect(t.x - s/2, t.y - s/2, s, s);
    }

    for (const o of obstacles){
      ctx.fillStyle = '#ff00ea'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff00ea';
      if (o.type === 'spike'){
        ctx.beginPath();
        ctx.moveTo(o.x + o.w/2, o.y);
        ctx.lineTo(o.x + o.w, o.y + o.h);
        ctx.lineTo(o.x, o.y + o.h);
        ctx.closePath(); ctx.fill();
      } else {
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }
      ctx.shadowBlur = 0;
    }

    for (const c of coinsArr){
      ctx.save();
      ctx.translate(c.x, c.y);
      const sx = Math.abs(Math.cos(c.ang));
      ctx.scale(Math.max(0.15, sx), 1);
      ctx.fillStyle = '#ffd700'; ctx.shadowBlur = 18; ctx.shadowColor = '#ffd700';
      ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#b8860b';
      ctx.beginPath(); ctx.arc(0, 0, c.r * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(cube.x + cube.w/2, cube.y + cube.h/2);
    ctx.rotate(cube.rot);
    ctx.fillStyle = '#00d4ff'; ctx.shadowBlur = 20; ctx.shadowColor = '#00d4ff';
    ctx.fillRect(-cube.w/2, -cube.h/2, cube.w, cube.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0a0a1a';
    ctx.fillRect(-cube.w/2 + 8, -cube.h/2 + 8, 8, 8);
    ctx.fillRect(cube.w/2 - 16, -cube.h/2 + 8, 8, 8);
    ctx.fillRect(-cube.w/2 + 8, cube.h/2 - 16, 8, 8);
    ctx.fillRect(cube.w/2 - 16, cube.h/2 - 16, 8, 8);
    ctx.restore();

    for (const p of particles){
      const a = p.life / p.maxLife;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  function loop(){ update(); draw(); requestAnimationFrame(loop); }

  function start(){
    initAudio();
    reset();
    overlay.classList.add('hidden');
    state = 'playing';
    jumpBtn.style.display = 'block';
  }

  startBtn.addEventListener('click', start);
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state === 'playing') jump();
  });
  jumpBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); jump(); });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if (state === 'idle' || state === 'dead') start(); else jump();
    }
  });
  window.addEventListener('resize', () => { resize(); groundY = H * GROUND_RATIO; });

  if (window.Telegram && window.Telegram.WebApp){
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
    try { window.Telegram.WebApp.setHeaderColor('#0a0a1a'); } catch(e){}
  }

  resize();
  reset();
  loop();
})();
</script>
</body>
</html>
